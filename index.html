<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta property="og:title" content="BR Tech Quizzes">
<meta property="og:description" content="Let's check how celever we are!">
<meta property="og:image" content="439880869_422871417155705_573210201420403259_n.jpg">
<meta property="og:url" content="https://sama-w2el.github.io/BR-Tech/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="439880869_422871417155705_573210201420403259_n.jpg">
    <title>BR Tech Quizzes for Kids</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            background-image: url('logo.png');
            background-size: cover;
            background-size: contain;
             background-repeat: no-repeat;
             background-size: 100% 100vh;
            background-color:18144e;
    
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        .header h1 {
            font-size: 2.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
         .header p {
            font-size: 1.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .quiz-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .quiz-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            border-radius: 20px 20px 0 0;
        }

        .quiz-icon {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        .quiz-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .quiz-desc {
            color: #666;
            font-size: 1em;
        }

        .stats {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        .stat-item {
            display: inline-block;
            margin: 0 15px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .shape {
            position: absolute;
            animation: float 6s ease-in-out infinite;
        }

        .shape1 { top: 10%; left: 10%; animation-delay: 0s; }
        .shape2 { top: 20%; right: 10%; animation-delay: 2s; }
        .shape3 { bottom: 20%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @media (max-width: 768px) {
            .quiz-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }

        .play-btn {
            background: linear-gradient(45deg, #ff6b6b, #f7931e);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape shape1">⭐</div>
        <div class="shape shape2">🌟</div>
        <div class="shape shape3">✨</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>BR Tech Quizzes for Kids</h1>
            <p>Test your knowledge and have fun!</p>
        </div>

        <div class="quiz-grid" id="quizGrid">
            <!-- Quizzes will be loaded here -->
        </div>

    </div>

    <script>
        const quizzes = [
            {
                id: 1,
                title: "Web Development",
                desc: "Let's check how celever we are!",
                icon: "🌐",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit" // Put your quiz link here
            },
            {
                id: 2,
                title: "Mobile Application",
                desc: "Let's check how celever we are!",
                icon: "📱",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            },
            {
                id: 3,
                title: "Game Development",
                desc: "Let's check how celever we are!",
                icon: "🕹️",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            },
            {
                id: 4,
                title: "Robotics",
                desc: "Let's check how celever we are!",
                icon: "🤖",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            },
            
        ];

        let completedQuizzes = JSON.parse(localStorage.getItem('completedQuizzes')) || [];
        let scores = JSON.parse(localStorage.getItem('scores')) || {};

        function createQuizCard(quiz) {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.onclick = () => openQuiz(quiz);
            
            const isCompleted = completedQuizzes.includes(quiz.id);
            
            card.innerHTML = `
                <div class="quiz-icon">${quiz.icon}</div>
                <div class="quiz-title">${quiz.title}</div>
                <div class="quiz-desc">${quiz.desc}</div>
                <button class="play-btn">Start Now</button>
            `;
            
            return card;
        }

        function openQuiz(quiz) {
            // Open quiz in new window
            window.open(quiz.link, '_blank');
            
            // Mark quiz as completed (you can modify this based on your scoring system)
            if (!completedQuizzes.includes(quiz.id)) {
                completedQuizzes.push(quiz.id);
                localStorage.setItem('completedQuizzes', JSON.stringify(completedQuizzes));
            }
            
            updateStats();
        }

        function updateStats() {
            const total = quizzes.length;
            const completed = completedQuizzes.length;
            const avgScore = completed > 0 ? Math.round(
                (completedQuizzes.reduce((sum, id) => sum + (scores[id] || 0), 0) / completed)
            ) : 0;

            document.getElementById('totalQuizzes').textContent = total;
            document.getElementById('completedQuizzes').textContent = completed;
            document.getElementById('avgScore').textContent = avgScore + '%';

            document.getElementById('stats').style.display = 'block';
        }

        // Load quizzes
        document.addEventListener('DOMContentLoaded', function() {
            const quizGrid = document.getElementById('quizGrid');
            
            quizzes.forEach(quiz => {
                quizGrid.appendChild(createQuizCard(quiz));
            });
            
            updateStats();
        });

        // Additional effects
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.quiz-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.3), rgba(255,255,255,0.95))`;
            });
        });
    </script>
</body>
</html>
