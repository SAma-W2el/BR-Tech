<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="439880869_422871417155705_573210201420403259_n.jpg">
    <title>BR Tech Quizzes for Kids</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            background-image: url('logo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        /* Overlay لتحسين القراءة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: bounce 2s infinite;
            padding: 20px;
        }

        .header h1 {
            font-size: clamp(1.8em, 5vw, 3.5em);
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .header p {
            font-size: clamp(1.1em, 3vw, 1.8em);
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .quiz-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .quiz-card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .quiz-card:active {
            transform: translateY(-5px) scale(1.01);
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24, #ff6b6b);
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
            border-radius: 25px 25px 0 0;
        }

        .quiz-icon {
            font-size: clamp(3em, 8vw, 5em);
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .quiz-title {
            font-size: clamp(1.2em, 4vw, 1.6em);
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .quiz-desc {
            color: #666;
            font-size: clamp(0.9em, 2.5vw, 1.1em);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .play-btn {
            background: linear-gradient(45deg, #ff6b6b, #f7931e);
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 16px) clamp(20px, 5vw, 30px);
            border-radius: 30px;
            font-size: clamp(1em, 2.5vw, 1.2em);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255,107,107,0.6);
        }

        .stats {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stats h3 {
            font-size: clamp(1.2em, 3vw, 1.5em);
            color: #333;
            margin-bottom: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
        }

        .stat-item {
            padding: 15px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-number {
            font-size: clamp(1.5em, 5vw, 2.5em);
            font-weight: bold;
            color: #4ecdc4;
            line-height: 1;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .shape {
            position: absolute;
            font-size: clamp(1.5em, 4vw, 2.5em);
            animation: float 8s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(255,255,255,0.5));
        }

        .shape1 { top: 15%; left: 5%; animation-delay: 0s; }
        .shape2 { top: 25%; right: 5%; animation-delay: 2s; }
        .shape3 { bottom: 25%; left: 10%; animation-delay: 4s; }
        .shape4 { top: 60%; right: 15%; animation-delay: 1s; font-size: clamp(1.2em, 3vw, 2em); }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            33% { transform: translateY(-25px) rotate(120deg) scale(1.1); }
            66% { transform: translateY(-10px) rotate(240deg) scale(0.9); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-8px); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Mouse follow effect */
        .quiz-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(600px circle at var(--x, 0) var(--y, 0), 
                        rgba(255,255,255,0.3), transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        .quiz-card:hover::after {
            opacity: 1;
        }

        /* Responsive Improvements */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header {
                margin-bottom: 30px;
                padding: 15px;
            }
            
            .quiz-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .quiz-card {
                padding: 25px 20px;
                margin: 0 5px;
            }
            
            .stats {
                padding: 25px 20px;
                margin-top: 25px;
            }
            
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .header {
                padding: 10px;
                margin-bottom: 25px;
            }
            
            .quiz-card {
                padding: 20px 15px;
                margin: 0;
            }
            
            .play-btn {
                padding: 14px 25px;
                font-size: 1em;
            }
            
            .stats {
                padding: 20px 15px;
            }
            
            .stat-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading animation */
        .loading {
            opacity: 0;
            transform: translateY(30px);
            animation: slideInUp 0.6s ease forwards;
        }

        .loading:nth-child(1) { animation-delay: 0.1s; }
        .loading:nth-child(2) { animation-delay: 0.2s; }
        .loading:nth-child(3) { animation-delay: 0.3s; }
        .loading:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape shape1">⭐</div>
        <div class="shape shape2">🌟</div>
        <div class="shape shape3">✨</div>
        <div class="shape shape4">⚡</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>BR Tech Quizzes for Kids</h1>
            <p>Test your knowledge and have fun!</p>
        </div>

        <div class="quiz-grid" id="quizGrid">
            <!-- Quizzes will be loaded here -->
        </div>

        <div class="stats" id="stats" style="display: none;">
            <h3>Your Progress</h3>
            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-label">Total Quizzes</div>
                    <div class="stat-number" id="totalQuizzes">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Completed</div>
                    <div class="stat-number" id="completedQuizzes">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Avg Score</div>
                    <div class="stat-number" id="avgScore">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quizzes = [
            {
                id: 1,
                title: "Web Development",
                desc: "Let's check how clever we are!",
                icon: "🌐",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            },
            {
                id: 2,
                title: "Mobile Application",
                desc: "Let's check how clever we are!",
                icon: "📱",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            },
            {
                id: 3,
                title: "Game Development",
                desc: "Let's check how clever we are!",
                icon: "🕹️",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            },
            {
                id: 4,
                title: "Robotics",
                desc: "Let's check how clever we are!",
                icon: "🤖",
                link: "https://docs.google.com/forms/d/16df2b3SN8HuN2Y_PzrTFK-J3Do7Dtw0_nJiU1aLQPM8/edit"
            }
        ];

        let completedQuizzes = JSON.parse(localStorage.getItem('completedQuizzes')) || [];
        let scores = JSON.parse(localStorage.getItem('scores')) || {};

        function createQuizCard(quiz) {
            const card = document.createElement('div');
            card.className = 'quiz-card loading';
            card.onclick = () => openQuiz(quiz);
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            
            const isCompleted = completedQuizzes.includes(quiz.id);
            
            card.innerHTML = `
                <div class="quiz-icon">${quiz.icon}</div>
                <div class="quiz-title">${quiz.title}</div>
                <div class="quiz-desc">${quiz.desc}</div>
                <button class="play-btn"> Start Now</button>
            `;
            
            // Mouse follow effect
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--x', x + 'px');
                card.style.setProperty('--y', y + 'px');
            });
            
            // Keyboard accessibility
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openQuiz(quiz);
                }
            });
            
            return card;
        }

        function openQuiz(quiz) {
            window.open(quiz.link, '_blank', 'noopener,noreferrer');
            
            if (!completedQuizzes.includes(quiz.id)) {
                completedQuizzes.push(quiz.id);
                localStorage.setItem('completedQuizzes', JSON.stringify(completedQuizzes));
            }
            
            updateStats();
        }

       

        // Load quizzes
        document.addEventListener('DOMContentLoaded', function() {
            const quizGrid = document.getElementById('quizGrid');
            
            quizzes.forEach((quiz, index) => {
                const card = createQuizCard(quiz);
                quizGrid.appendChild(card);
            });
            
            updateStats();
            
            // Smooth scroll for better mobile experience
            document.body.style.scrollBehavior = 'smooth';
        });

        // PWA-like behavior
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {
                    // Service worker not available
                });
            });
        }
    </script>
</body>
</html>
